name: flyrank

services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./server.js
        - action: rebuild
          path: ./db.js
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./prompts
        - action: rebuild
          path: ./openapi.json
        - action: rebuild
          path: ./package.json

  db:
    image: postgres:16
    container_name: flyrank-db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - flyrank-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flyrank-data:
    name: flyrank-data